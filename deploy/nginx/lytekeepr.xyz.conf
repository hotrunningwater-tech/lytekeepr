server {
    listen 80;
    listen [::]:80;
    server_name lytekeepr.xyz www.lytekeepr.xyz;

    root /var/www/lytekeepr.xyz/current;
    index index.html;

    access_log /var/www/lytekeepr.xyz/shared/logs/access.log;
    error_log /var/www/lytekeepr.xyz/shared/logs/error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
