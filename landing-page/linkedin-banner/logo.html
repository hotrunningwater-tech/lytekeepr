<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap">
<style>
  /* LinkedIn page logo: 400x400 (rendered at 2x) */
  html, body { margin: 0; padding: 0; }
  body {
    width: 400px; height: 400px; overflow: hidden;
    background: #f2f8fa; color: #29434E;
    display: flex; align-items: center; justify-content: center;
    font-family: "General Sans", sans-serif;
  }
  .mark { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .dot { width: 96px; height: 96px; border-radius: 50%; background: #e98b74; }
  .name { font-weight: 700; font-size: 62px; letter-spacing: -1.2px; }
</style>
</head>
<body>
  <div class="mark">
    <div class="dot"></div>
    <div class="name">LyteKeepr</div>
  </div>
