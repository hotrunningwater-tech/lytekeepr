<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LyteKeepr">
<title>LyteKeepr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329434e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e98b74'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap">
<style>
/* The phone version: three pages side by side (Calendar · Today · Needs attention) that snap when swiped, search pulled down
   from the top, meeting and contact cards as sheets that slide up. Same palette and type as the desktop app. */
:root {
  --backdrop: #b5c9d1; --surface: #f2f8fa; --card: #ffffff; --ink: #29434e; --ink-soft: #657d86; --line: rgba(41,67,78,.10);
  --field: rgba(230,237,240,.85); --on-ink: #f2f8fa; --shadow: 0 6px 22px rgba(41,67,78,.14);
  --teal: #7fa8b8; --coral: #e98b74; --deep: #21493f; --plum: #7b6fa8; --accent: #3a9cbc;
  --ok: #1f6b46; --ok-bg: #d8eee2; --warn: #8a5a10; --warn-bg: #f6e6c9; --bad: #a3412b; --bad-bg: #f7d9d2;
  --font-display: "General Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface); color: var(--ink); font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

.phone { position: relative; height: 100%; max-width: 520px; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
.top { padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; flex-direction: column; gap: 10px; background: var(--surface); z-index: 3; }
.brandrow { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--field); display: grid; place-items: center; }
.iconbtn:first-of-type { margin-left: auto; }
.me { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--ink); color: var(--on-ink); font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--field); border-radius: 999px; padding: 4px; }
.tab { border: none; background: none; border-radius: 999px; padding: 8px 4px; font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--ink-soft); display: flex; justify-content: center; align-items: center; gap: 6px; }
.tab.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(41,67,78,.12); }
.count { min-width: 18px; height: 18px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px; font-family: var(--font-body); font-weight: 600; }

.pages { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.pages::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; padding: 12px 16px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pullhint { align-self: center; font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; transition: transform .15s, color .15s; }
.pullhint.ready { color: var(--accent); }
.lbl { font-family: var(--font-display); font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.lbl .count { background: var(--teal); }
.lbl .link { margin-left: auto; border: none; background: var(--field); border-radius: 999px; padding: 5px 11px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink); }

.dayhead h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.dayhead p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; background: var(--field); color: var(--ink); }
.chip.warn { background: var(--bad-bg); color: var(--bad); }
.next { background: var(--ink); color: var(--on-ink); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.next small { font-family: var(--font-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; opacity: .75; }
.next h2 { font-size: 20px; font-weight: 600; line-height: 1.25; }
.next p { margin: 0; font-size: 13.5px; opacity: .8; }
.next .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: none; border-radius: 999px; padding: 10px 16px; font-family: var(--font-display); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; justify-content: center; text-decoration: none; }
.btn.light { background: var(--on-ink); color: var(--ink); }
.btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
.btn.ink { background: var(--ink); color: var(--on-ink); }
.btn.soft { background: var(--field); color: var(--ink); }
.btn.sm { padding: 7px 12px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; }

.list { background: var(--card); border-radius: 18px; padding: 2px 14px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(41,67,78,.06); }
.item { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.tap { cursor: pointer; }
.item .time { font-size: 13px; font-weight: 600; color: var(--ink-soft); line-height: 1.25; }
.item .what { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .what b { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.item .what span { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.p-nexy { background: var(--deep); } .p-aspan { background: var(--coral); } .p-lytekeepr { background: var(--teal); } .p-google { background: var(--plum); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink-soft); background: none; display: grid; place-items: center; padding: 0; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.item.done .what b { text-decoration: line-through; color: var(--ink-soft); }
.go { color: var(--ink-soft); font-size: 22px; line-height: 1; padding: 0 2px; }
.empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 22px 0; }
.loading { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 40px 0; }

.card { background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 3px rgba(41,67,78,.06); transition: opacity .25s, transform .25s; }
.card.gone { opacity: 0; transform: translateX(40px); }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 13px; flex: none; }
.who .meta { min-width: 0; } .who b { font-size: 14.5px; display: block; } .who small { display: block; color: var(--ink-soft); font-size: 12.5px; }
.who .when { margin-left: auto; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.card p { margin: 0; font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }

.calhead { display: flex; align-items: center; gap: 6px; }
.calhead h2 { font-size: 19px; font-weight: 700; }
.calhead .nav { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--field); font-size: 17px; }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--field); border-radius: 999px; padding: 3px; margin-left: auto; }
.seg button { border: none; background: none; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-family: var(--font-display); font-size: 13px; color: var(--ink-soft); }
.seg button.on { background: var(--card); color: var(--ink); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { border: none; background: var(--card); border-radius: 14px; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.wd small { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: .05em; }
.wd b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.dots { display: flex; gap: 2px; height: 6px; } .dots i { width: 5px; height: 5px; border-radius: 50%; }
.wd.today b, .md.today { color: var(--coral); }
.wd.on, .md.on { background: var(--ink); color: var(--on-ink); } .wd.on small, .wd.on b { color: var(--on-ink); }
.wd.on .dots i, .md.on .dots i { box-shadow: 0 0 0 1.5px var(--on-ink); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.month .dow { text-align: center; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); padding-bottom: 2px; }
.md { border: none; background: var(--card); border-radius: 12px; aspect-ratio: 1; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 14px; font-weight: 600; padding: 0; }
.md.out { background: transparent; color: var(--ink-soft); opacity: .55; }

.claude { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 4; border-radius: 999px; background: var(--ink); color: var(--on-ink);
  padding: 12px 18px 12px 13px; display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 600; font-size: 14.5px; box-shadow: var(--shadow); text-decoration: none; }
.claude .mic { width: 28px; height: 28px; border-radius: 50%; background: var(--coral); display: grid; place-items: center; color: #fff; }

.dim { position: absolute; inset: 0; background: rgba(13,23,27,.38); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 6; }
.dim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; background: var(--surface); border-radius: 26px 26px 0 0; z-index: 7; transform: translateY(105%);
  transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(13,23,27,.25); }
.sheet.on { transform: translateY(0); }
.grab { position: relative; padding: 14px 16px 6px; display: flex; align-items: center; gap: 10px; touch-action: none; min-height: 52px; }
.grab::before { content: ""; position: absolute; left: 50%; top: 8px; width: 40px; height: 5px; border-radius: 3px; background: rgba(101,125,134,.35); transform: translateX(-50%); }
.back { border: none; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 0; }
.close { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--field); font-size: 20px; line-height: 1; }
.sbody { overflow-y: auto; padding: 2px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.hero { display: flex; gap: 12px; align-items: center; }
.hero .avatar { width: 54px; height: 54px; font-size: 19px; }
.hero h2 { font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.hero p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; align-self: flex-start; box-shadow: 0 1px 3px rgba(41,67,78,.08); }
.facts { background: var(--card); border-radius: 16px; padding: 2px 14px; }
.fact { display: grid; grid-template-columns: 100px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.fact:first-child { border-top: 0; }
.fact > span:first-child { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); }
.fact .val { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.reach { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.reach a, .reach span { background: var(--card); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; text-decoration: none; box-shadow: 0 1px 3px rgba(41,67,78,.06); }
.reach span { opacity: .4; }
.reach svg { color: var(--accent); }
.hint { font-size: 13px; color: var(--ink-soft); background: var(--field); border-radius: 12px; padding: 10px 12px; line-height: 1.45; }
.status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.status button { border: none; background: var(--card); border-radius: 999px; padding: 9px 4px; font-family: var(--font-display); font-weight: 600; font-size: 13px; box-shadow: 0 1px 3px rgba(41,67,78,.06); }
.status button.on { background: var(--ink); color: var(--on-ink); }
.person { display: flex; align-items: center; gap: 10px; border: none; background: var(--card); border-radius: 16px; padding: 10px 12px; text-align: left; width: 100%; box-shadow: 0 1px 3px rgba(41,67,78,.06); }
.person.mail .go { font-size: 12px; color: var(--ink-soft); align-self: flex-start; }
.person.mail small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .person.mail small.subj { color: var(--ink); font-weight: 600; }
.mailtext { background: var(--card); border-radius: 16px; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.5; }
.person .meta { min-width: 0; flex: 1; } .person b { display: block; font-size: 14.5px; overflow-wrap: anywhere; } .person small { color: var(--ink-soft); font-size: 12.5px; }
textarea { width: 100%; min-height: 84px; border: none; border-radius: 14px; background: var(--card); padding: 11px 12px; font: inherit; color: var(--ink); resize: vertical; }
.saved { font-size: 12px; color: var(--ok); min-height: 1em; }
.joinlink { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }

.search { position: absolute; inset: 0; z-index: 8; background: var(--surface); transform: translateY(-102%); transition: transform .26s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.search.on { transform: translateY(0); }
.sbar { display: flex; gap: 10px; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px; }
.sfield { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 0 14px; box-shadow: 0 1px 4px rgba(41,67,78,.10); }
.sfield input { flex: 1; min-width: 0; border: none; background: none; padding: 12px 0; font: inherit; font-size: 16px; color: var(--ink); outline: none; }
.cancel { border: none; background: none; color: var(--accent); font-weight: 600; font-size: 15px; }
.sres { overflow-y: auto; padding: 4px 16px 30px; display: flex; flex-direction: column; gap: 14px; }
.sgroup { display: flex; flex-direction: column; gap: 6px; }
.sres { flex: 1; }
.swipeup { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--ink-soft); padding: 10px 0 calc(14px + env(safe-area-inset-bottom, 0px)); }

.toast { position: absolute; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--ink); color: var(--on-ink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
@media (min-width: 560px) { body { background: var(--backdrop); } .phone { box-shadow: var(--shadow); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="brandrow">
      <span class="brand"><i></i>LyteKeepr</span>
      <button class="iconbtn" id="searchBtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="me" id="meBtn" aria-label="Account">·</button>
    </div>
    <nav class="tabs" aria-label="Pages">
      <button class="tab" data-page="0">Calendar</button>
      <button class="tab on" data-page="1">Today</button>
      <button class="tab" data-page="2">Attention <span class="count num" id="attCount" hidden>0</span></button>
      <button class="tab" data-page="3" id="mailTab" hidden>Email</button>
    </nav>
  </header>

  <main class="pages" id="pages">
    <section class="page" id="pCal" aria-label="Calendar">
      <div class="pullhint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Pull down to search</div>
      <div class="calhead"><button class="nav" id="calPrev" aria-label="Earlier">‹</button><h2 id="calTitle" class="num"></h2><button class="nav" id="calNext" aria-label="Later">›</button>
        <div class="seg"><button class="on" id="segWeek">Week</button><button id="segMonth">Month</button></div></div>
      <div id="calGrid"></div>
      <div class="lbl" id="calDayLabel"></div>
      <div id="calDayList"></div>
    </section>
    <section class="page" id="pToday" aria-label="Today">
      <div class="pullhint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Pull down to search</div>
      <div id="todayBody"><p class="loading">Loading your day…</p></div>
    </section>
    <section class="page" id="pAtt" aria-label="Needs attention">
      <div class="pullhint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Pull down to search</div>
      <div id="attBody" style="display:flex;flex-direction:column;gap:14px"><p class="loading">Loading…</p></div>
    </section>
    <section class="page" id="pMail" aria-label="Email" hidden>
      <div class="pullhint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Pull down to search</div>
      <div id="mailBody" style="display:flex;flex-direction:column;gap:8px"><p class="loading">Loading…</p></div>
    </section>
  </main>

  <a class="claude" id="claudeBtn" href="https://claude.ai/new?q=In%20LyteKeepr%3A%20" target="_blank" rel="noopener"><span class="mic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Speak to Claude</a>

  <div class="dim" id="dim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details">
    <div class="grab" id="grab"><button class="back" id="sheetBack" hidden>‹ Back</button><button class="close" id="sheetClose" aria-label="Close">×</button></div>
    <div class="sbody" id="sheetBody"></div>
  </section>

  <section class="search" id="search" aria-label="Search">
    <div class="sbar">
      <label class="sfield"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Name, company, meeting or opportunity" autocomplete="off" enterkeyhint="search"></label>
      <button class="cancel" id="searchCancel">Cancel</button>
    </div>
    <div class="sres" id="sres"></div>
    <div class="swipeup"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Swipe up to close</div>
  </section>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  'use strict';
  var PREFIX = window.LK_PREFIX || '';
  var PROJECTS = { lytekeepr: 'LyteKeepr', aspan: 'Aspan', nexy: 'Nexy', google: 'Google' };       // brands (loaded from the server) + the Google source
  var COLORS = { lytekeepr: '#7fa8b8', aspan: '#e98b74', nexy: '#21493f', google: '#7b6fa8' };
  var CH = { linkedin: 'LinkedIn', instagram: 'Instagram', email: 'Email' };

  /* ---------- Calendar: week or month ---------- */

        row.addEventListener('click', function () { closeSearch(); openContact(c.id); }); return row;
      }));
      group('Opportunities', opps.map(function (o) {
        var row = el('button', 'person', '<span class="avatar" style="background:var(--accent)">◆</span><span class="meta"><b>' + esc(o.name) + '</b><small>' + esc(o.summary) + '</small></span><span class="go">›</span>');
        row.addEventListener('click', function () { closeSearch(); openOpportunity(o.opportunity_id); }); return row;
      }));
      var ql = q.toLowerCase();
      group('Meetings', (recentEvents || []).filter(function (e) { return isMeeting(e) && e.title.toLowerCase().indexOf(ql) >= 0; }).slice(0, 8).map(function (e) {
        var row = el('button', 'person', '<span class="avatar" style="background:var(--plum)">' + ICON.cal + '</span><span class="meta"><b>' + esc(e.title) + '</b><small>' + esc(dateLabel(e.date) + (e.untimed ? '' : ' · ' + time12(e.start_time))) + '</small></span><span class="go">›</span>');
        row.addEventListener('click', function () { closeSearch(); openMeeting(e); }); return row;
      }));
      if (!box.children.length) box.appendChild(el('p', 'empty', 'Nothing matches “' + esc(q) + '”. Try a first name or a company.'));
    }).catch(fail);
  }
  document.querySelectorAll('.page').forEach(function (page) {
    var y0 = null, hint = page.querySelector('.pullhint');
    page.addEventListener('touchstart', function (e) { y0 = page.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
    page.addEventListener('touchmove', function (e) {
      if (y0 == null) return; var dy = e.touches[0].clientY - y0;
      hint.style.transform = 'translateY(' + Math.max(0, Math.min(dy, 80)) / 2 + 'px)'; hint.classList.toggle('ready', dy > 70);
    }, { passive: true });
    page.addEventListener('touchend', function (e) {
      if (y0 == null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null;
      hint.style.transform = ''; hint.classList.remove('ready');
      if (dy > 70) openSearch();
    });
  });

  /* ---------- pages ---------- */
  var pages = $('pages'), tabs = document.querySelectorAll('.tab');
  function goTo(i, smooth) { pages.scrollTo({ left: i * pages.clientWidth, behavior: smooth ? 'smooth' : 'auto' }); }
  tabs.forEach(function (t) { t.addEventListener('click', function () { goTo(+t.getAttribute('data-page'), true); }); });
  pages.addEventListener('scroll', function () { var i = Math.round(pages.scrollLeft / pages.clientWidth); tabs.forEach(function (t, k) { t.classList.toggle('on', k === i); }); }, { passive: true });
  window.addEventListener('resize', function () { var i = [].findIndex.call(tabs, function (t) { return t.classList.contains('on'); }); goTo(i < 0 ? 1 : i); });

  /* ---------- data ---------- */
  function refresh() {
    state.eventsCache = {};
    return Promise.all([api('GET', '/api/calendar/agenda'), api('GET', '/api/calls/attention').catch(function () { return { ready: [], missing: [] }; }),
                        api('GET', '/api/crm/suggestions').catch(function () { return { suggestions: [] }; }),
                        api('GET', '/api/crm/brands').catch(function () { return null; })])
      .then(function (r) {
        if (r[3] && r[3].brands) r[3].brands.concat(r[3].sources || []).forEach(function (b) { PROJECTS[b.key] = b.name; COLORS[b.key] = b.color; });
        state.agenda = r[0]; state.calls = r[1] || { ready: [], missing: [] }; state.suggestions = (r[2] && r[2].suggestions) || [];
        state.now = r[0].now; state.today = r[0].now.slice(0, 10);
        if (!state.cal.anchor) { state.cal.anchor = state.today; state.cal.sel = state.today; }
        renderToday(); renderAttention(); renderCal();
      }).catch(fail);
  }
  api('GET', '/api/me').then(function (me) {
    state.me = me; $('meBtn').textContent = initials(me.name || me.email);
    if (me.role === 'admin' || me.share_emails) {   // the admin's mailbox: the admin, and team members they shared it with (only their contacts' emails)
      $('mailTab').hidden = false; $('pMail').hidden = false;
      api('GET', '/api/crm/email/lookup?limit=200').then(function (r) { state.mail = r.emails || []; renderMail(); })
        .catch(function (e) { $('mailBody').replaceChildren(el('p', 'empty', esc(e.message))); });
    }
  }).catch(function () {});
  refresh();
  requestAnimationFrame(function () { goTo(1); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });      // back from Claude: show what changed
  setInterval(function () { if (!document.hidden) refresh(); }, 120000);
})();
</script>
</body>
</html>
